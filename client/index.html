<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ChatGPT Image Jun 25, 2025, 11_25_57 AM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - 3D Interactive Experience</title>
    <meta name="description" content="A modern 3D portfolio website with interactive scroll-based camera movement and glassmorphism design." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <style>
      /* Prevent flash of unstyled content */
      body { 
        margin: 0; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow-x: hidden;
      }
      #root { 
        width: 100%; 
        height: 100vh; 
        position: relative;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
    <script>
      // Prevent inspect element and refresh page
      document.addEventListener('keydown', function(e) {
        // Detect Ctrl+Shift+I or F12
        if ((e.ctrlKey && e.shiftKey && e.key === 'I') || e.key === 'F12') {
          e.preventDefault();
          location.reload();
        }
      });

      // Prevent right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
