<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ChatGPT Image Jun 25, 2025, 11_25_57 AM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - 3D Interactive Experience</title>
    <meta name="description" content="A modern 3D portfolio website with interactive scroll-based camera movement and glassmorphism design." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <style>
      /* Prevent flash of unstyled content */
      body { 
        margin: 0; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow-x: hidden;
      }
      #root { 
        width: 100%; 
        height: 100vh; 
        position: relative;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
    <script>
      // Prevent inspect element
      document.addEventListener('keydown', function(e) {
        // Detect various developer tool shortcuts
        if (
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          // F12
          e.key === 'F12' ||
          // Ctrl+Shift+K (Firefox)
          (e.ctrlKey && e.shiftKey && e.key === 'K') ||
          // Command+Option+I (Mac)
          (e.metaKey && e.altKey && e.key === 'i') ||
          // Command+Option+J (Mac)
          (e.metaKey && e.altKey && e.key === 'j') ||
          // Command+Option+C (Mac)
          (e.metaKey && e.altKey && e.key === 'c')
        ) {
          e.preventDefault();
          return false;
        }
      });

      // Prevent right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Better way to detect and prevent dev tools
      let devtools = false;
      const threshold = 160;
      const emitEvent = function() {
        // Only act if dev tools were opened
        if (devtools === false) {
          devtools = true;
          window.location.href = window.location.href;
        }
      };

      // Check width/height changes
      const checkWindowSize = function() {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        if (widthThreshold || heightThreshold) {
          emitEvent();
        }
      };

      setInterval(checkWindowSize, 1000);

      // Disable source view
      document.onkeydown = function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
