<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - dhyey khanpara</title>
    <meta name="description" content="Code the Cosmos. Design the Difference." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <style>
      /* Prevent flash of unstyled content */
      body { 
        margin: 0; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow-x: hidden;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
      }
      #root { 
        width: 100vw; 
        min-height: 100vh; 
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Custom scrollbar for desktop only */
      @media (min-width: 769px) {
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.3);
          border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.5);
        }
      }

      /* Hide scrollbar on mobile for cleaner look */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          display: none;
        }
        body {
          font-size: 14px;
          -webkit-text-size-adjust: 100%;
        }
        #root {
          min-height: 100svh;
        }
        button, a {
          min-height: 44px;
          min-width: 44px;
        }
      }

      /* Ensure pointer events for navigation toggle and mobile menu */
      nav button,
      .mobile-menu,
      .mobile-menu * {
        pointer-events: auto !important;
      }

      /* Optionally, raise z-index for the hamburger button */
      nav button {
        z-index: 100;
        position: relative;
      }
    </style>
    <script>
      // Prevent inspect element
      document.addEventListener('keydown', function(e) {
        // Detect various developer tool shortcuts
        if (
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          // F12
          e.key === 'F12' ||
          // Ctrl+Shift+K (Firefox)
          (e.ctrlKey && e.shiftKey && e.key === 'K') ||
          // Command+Option+I (Mac)
          (e.metaKey && e.altKey && e.key === 'i') ||
          // Command+Option+J (Mac)
          (e.metaKey && e.altKey && e.key === 'j') ||
          // Command+Option+C (Mac)
          (e.metaKey && e.altKey && e.key === 'c')
        ) {
          e.preventDefault();
          return false;
        }
      });

      // Prevent right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // More reliable dev tools detection
      (function() {
        function detectDevTools() {
          const widthThreshold = window.outerWidth - window.innerWidth > 160;
          const heightThreshold = window.outerHeight - window.innerHeight > 160;
          
          if (widthThreshold || heightThreshold) {
            document.body.innerHTML = '';
            window.location.reload();
          }
        }

        window.addEventListener('resize', detectDevTools);
        setInterval(detectDevTools, 1000);

        // Additional detection method
        let element = new Image();
        Object.defineProperty(element, 'id', {
          get: function() {
            document.body.innerHTML = '';
            window.location.reload();
          }
        });
        console.debug(element);
      })();

      // Disable source view
      document.onkeydown = function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
